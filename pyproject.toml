[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "janus-decide"
version = "0.1.0"
description = "Measure a confidence-based routing policy on your own data, then run it"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Firas Ayadi" }]
keywords = ["calibration", "routing", "cascade", "llm", "confidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
typesafe = ["typesafe-sdk"]
# DeepSeek parle le protocole OpenAI : meme dependance, nom explicite pour
# qui installe Janus afin de l'utiliser.
deepseek = ["openai"]
openai = ["openai"]
anthropic = ["anthropic"]
report = ["matplotlib>=3.7"]
all = ["typesafe-sdk", "openai", "anthropic", "matplotlib>=3.7"]

[project.scripts]
janus = "janus.cli:main"

[project.urls]
Homepage = "https://github.com/FirasSX914/janus"
Source = "https://github.com/FirasSX914/janus"

[tool.hatch.build.targets.wheel]
packages = ["src/janus"]

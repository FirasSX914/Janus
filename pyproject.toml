[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "janus-decide"
version = "0.2.0"
description = "Measure a confidence-based routing policy on your own data, then run it"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Firas Ayadi" }]
keywords = ["calibration", "routing", "cascade", "llm", "confidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
typesafe = ["typesafe-sdk"]
# DeepSeek parle le protocole OpenAI : meme dependance, nom explicite pour
# qui installe Janus afin de l'utiliser.
deepseek = ["openai"]
openai = ["openai"]
anthropic = ["anthropic"]
report = ["matplotlib>=3.7"]
all = ["typesafe-sdk", "openai", "anthropic", "matplotlib>=3.7"]

[project.scripts]
janus = "janus.cli:main"

[project.urls]
Homepage = "https://github.com/FirasSX914/Janus"
Source = "https://github.com/FirasSX914/Janus"
Issues = "https://github.com/FirasSX914/Janus/issues"
Method = "https://github.com/FirasSX914/Janus/blob/main/docs/METHOD.md"

[tool.hatch.build.targets.wheel]
packages = ["src/janus"]

# L'archive source ne porte que le paquet et ses tests. Les donnees et les
# resultats de l'experience font plusieurs megaoctets et vivent dans le depot,
# pas dans une distribution destinee a etre installee. Les tests qui les lisent
# se declarent "skipped" en leur absence.
[tool.hatch.build.targets.sdist]
include = ["/src/janus", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]
